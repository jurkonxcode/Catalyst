<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#070a10">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Catalyst</title>
<link rel="stylesheet" href="css/style.css?v=13">
</head>
<body>

<section id="screen-auth" class="screen active">
  <div class="auth-wrap">
    <div class="auth-logo">🏭</div>
    <div class="auth-title">Catalyst</div>
    <div class="auth-sub">Bangun kerajaan bisnismu</div>
    <div class="tabs">
      <button class="tab-btn active" id="tabLogin" onclick="switchTab('login')">Masuk</button>
      <button class="tab-btn" id="tabRegister" onclick="switchTab('register')">Daftar</button>
    </div>
    <div id="authMsg" class="msg"></div>
    <form id="loginForm" onsubmit="doLogin(event)">
      <div class="field"><label>Email</label>
        <input type="email" id="loginEmail" placeholder="nama@email.com" required></div>
      <div class="field"><label>Password</label>
        <input type="password" id="loginPassword" placeholder="password kamu" required></div>
      <button type="submit" class="btn btn-primary" id="loginBtn">🔐 Masuk</button>
    </form>
    <form id="registerForm" style="display:none;" onsubmit="doRegister(event)">
      <div class="field"><label>Email</label>
        <input type="email" id="regEmail" placeholder="nama@email.com" required></div>
      <div class="field"><label>Password</label>
        <input type="password" id="regPassword" placeholder="min. 6 karakter" required></div>
      <div class="field"><label>Username</label>
        <input type="text" id="regUsername" placeholder="huruf/angka" required></div>
      <button type="submit" class="btn btn-green" id="registerBtn">📝 Buat Akun</button>
    </form>
  </div>
</section>

<section id="screen-onboarding" class="screen">
  <div class="auth-wrap">
    <div class="auth-logo" style="background:linear-gradient(135deg,#fbbf24,#f59e0b);">✨</div>
    <div class="auth-title">Buat Profil</div>
    <div class="auth-sub">Kenalkan perusahaanmu</div>
    <div id="onboardMsg" class="msg"></div>
    <div class="field">
      <label>Pilih Logo</label>
      <div class="avatar-grid" id="avatarGrid">
        <div class="avatar-opt selected" data-emoji="🏭">🏭</div>
        <div class="avatar-opt" data-emoji="⚡">⚡</div>
        <div class="avatar-opt" data-emoji="🚀">🚀</div>
        <div class="avatar-opt" data-emoji="🌾">🌾</div>
        <div class="avatar-opt" data-emoji="⛏️">⛏️</div>
        <div class="avatar-opt" data-emoji="💎">💎</div>
        <div class="avatar-opt" data-emoji="🏗️">🏗️</div>
        <div class="avatar-opt" data-emoji="🔧">🔧</div>
      </div>
    </div>
    <div class="field"><label>Nama Perusahaan</label>
      <input type="text" id="onboardCompany" placeholder="cth: PT Cahaya Energi" maxlength="30"></div>
    <button class="btn btn-gold" onclick="submitOnboarding()" id="onboardBtn">🚀 Mulai Bermain</button>
  </div>
</section>

<section id="screen-game" class="screen">
  <header>
    <div class="hdr-left">
      <div class="logo" id="hdrLogo">🏭</div>
      <div>
        <div class="company-name" id="hdrCompany">PT Anda</div>
        <div class="company-sub" id="hdrSub">Realtime Market</div>
      </div>
    </div>
    <div class="hdr-right">
      <div class="cash-box" id="hdrCash">$10,000</div>
      <div class="lvl-box">Lv <span id="hdrLevel">1</span></div>
    </div>
  </header>

  <!-- TICKER HARGA PEMIAN -->
  <div class="ticker" id="tickerBar">
    <div class="ticker-loading">Memuat harga pasar...</div>
  </div>

  <main class="content" id="gameContent"></main>

  <nav class="tabs">
    <button class="tab active" data-tab="buildings"><span class="tab-icon">🏭</span><span class="tab-label">Bangunan</span></button>
    <button class="tab" data-tab="storage"><span class="tab-icon">📦</span><span class="tab-label">Gudang</span></button>
    <button class="tab" data-tab="exchange"><span class="tab-icon">💱</span><span class="tab-label">Exchange</span></button>
    <button class="tab" data-tab="profile"><span class="tab-icon">👤</span><span class="tab-label">Profil</span></button>
  </nav>
</section>

<div id="toast"></div>
<div class="loading hidden" id="loading">
  <div class="spinner"></div>
  <div class="loading-text" id="loadingText">Memuat...</div>
</div>
<div id="modalContainer"></div>

<script>
  /* ============================================================
     AUTO CACHE-BUST v1.0
     Setiap load = versi baru (timestamp), tidak perlu manual update
     ============================================================ */
  (function() {
    var v = Date.now();

    // 1. Update CSS version juga
    var cssLink = document.querySelector('link[href*="style.css"]');
    if (cssLink) {
      cssLink.href = 'css/style.css?v=' + v;
    }

    // 2. Dynamic loader dengan urutan pasti
    function loadScript(src, cb) {
      var s = document.createElement('script');
      s.src = src;
      if (cb) s.onload = cb;
      s.onerror = function() { console.error('Failed to load:', src); };
      document.body.appendChild(s);
    }

    // 3. Load berurutan: supabase → config → app
    loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2', function() {
      loadScript('js/config.js?v=13' + v, function() {
        loadScript('js/app.js?v=13' + v);
      });
    });
  })();
</script>
</body>
</html>
